<!doctype html>
<html>
  <head>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      table.names {
        width: 100%;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <table style="width: 100%">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Rendy</td>
        <td>Kurniawan</td>
        <td>21</td>
      </tr>
    </table>

    <br />

    <table class="names">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Revalina</td>
        <td>Berliana</td>
        <td>21</td>
      </tr>
    </table>
  </body>
</html>
