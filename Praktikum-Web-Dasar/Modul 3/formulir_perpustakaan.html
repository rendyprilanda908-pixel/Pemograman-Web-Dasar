<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Perpustakaan Kota Madiun</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #263445;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #1b355018;
        }

        h1 {
            text-align: center;
            color: #174a7e;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #66788a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #c5d0dc;
            border-radius: 6px;
            font: inherit;
        }

        .inline label {
            display: inline-block;
            margin: 8px 16px 5px 0;
            font-weight: normal;
        }

        .actions {
            margin-top: 22px;
        }

        button {
            padding: 11px 17px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit {
            background: #1769aa;
            color: white;
        }

        .reset {
            background: #e5eaf0;
            color: #263445;
            margin-left: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #1769aa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Formulir Pendaftaran Perpustakaan</h1>
        <p class="subtitle">Perpustakaan Kota Madiun</p>

        <form action="latihan.html" method="get">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

            <label for="identitas">Nomor Identitas (NIK/NIS)</label>
            <input type="text" id="identitas" name="identitas" placeholder="Masukkan nomor identitas" required>

            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" required>

            <label for="telepon">Nomor Telepon</label>
            <input type="tel" id="telepon" name="telepon" placeholder="Masukkan nomor telepon">
            <div class="inline">
                <label>Jenis Kelamin</label><br>
                <label><input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki</label>
                <label><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
            </div>
            <label for="kategori">Kategori Anggota</label>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih kategori --</option>
                <option value="Pelajar">Pelajar</option>
                <option value="Mahasiswa">Mahasiswa</option>
                <option value="Umum">Umum</option>
            </select>
            <label for="tanggal">Tanggal Pendaftaran</label>
            <input type="date" id="tanggal" name="tanggal" required>
            <div class="inline">
                <label>Minat Bacaan</label><br>
                <label><input type="checkbox" name="minat" value="Pendidikan"> Pendidikan</label>
                <label><input type="checkbox" name="minat" value="Teknologi"> Teknologi</label>
                <label><input type="checkbox" name="minat" value="Novel"> Novel</label>
                <label><input type="checkbox" name="minat" value="Sejarah"> Sejarah</label>
            </div>
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat tempat tinggal"
                required></textarea>
            <label for="saran">Saran atau Komentar</label>
            <textarea id="saran" name="saran" rows="3" placeholder="Tuliskan saran Anda"></textarea>
            <div class="actions">
                <button class="submit" type="submit">Daftar Anggota</button>
                <button class="reset" type="reset">Kosongkan</button>
            </div>
        </form>
        <a class="back" href="latihan.html">Kembali ke halaman utama</a>
    </div>
</body>

</html>
